name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r api/requirements.txt -r ingest/requirements.txt
      - run: pip install pytest
      - name: run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: pytest -v --junitxml=report.xml
      # TODO (Phase 5): upload report.xml as an artifact.

  # TODO (Phase 5): add a `build` job that builds the image and pushes it
  # to ghcr.io/<your-lowercase-username>/dataeko-capstone:latest
